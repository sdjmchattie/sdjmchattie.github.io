<div class="mermaid" style="white-space: pre;">
  {{- .Inner | safeHTML }}
</div>
{{- if not (.Page.Store.Get "hasMermaid") }}
{{- .Page.Store.Set "hasMermaid" true }}
<style>
  .mermaid {
    background-color: transparent !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 2rem 0 !important;
    display: flex !important;
    justify-content: center !important;
    border-radius: 0 !important;
    white-space: pre !important;
    overflow-x: auto !important;
  }
  .mermaid svg {
    max-width: 100% !important;
    height: auto !important;
  }

  /* Ensure lines, arrows, and markers stay clearly visible in dark mode */
  body.dark .mermaid svg .edgePath path,
  body.dark .mermaid svg .flowchart-link,
  html.dark .mermaid svg .edgePath path,
  html.dark .mermaid svg .flowchart-link {
    stroke: #90cdf4 !important;
  }
  body.dark .mermaid svg marker path,
  body.dark .mermaid svg marker polygon,
  html.dark .mermaid svg marker path,
  html.dark .mermaid svg marker polygon {
    fill: #90cdf4 !important;
    stroke: #90cdf4 !important;
  }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  // Cache raw text for all diagrams before rendering
  const diagramSources = new Map();
  document.querySelectorAll('.mermaid').forEach((el) => {
    diagramSources.set(el, el.textContent);
  });

  function isDarkMode() {
    return document.documentElement.classList.contains('dark') ||
           document.body.classList.contains('dark') ||
           localStorage.getItem('pref-theme') === 'dark' ||
           (!localStorage.getItem('pref-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  let isRendering = false;
  async function renderDiagrams() {
    if (isRendering) return;
    isRendering = true;

    try {
      const isDark = isDarkMode();
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
      });

      const elements = Array.from(document.querySelectorAll('.mermaid'));
      elements.forEach((el) => {
        const raw = diagramSources.get(el);
        if (raw) {
          el.removeAttribute('data-processed');
          el.textContent = raw;
        }
      });

      await mermaid.run();
    } catch (err) {
      console.warn('Mermaid rendering note:', err);
    } finally {
      isRendering = false;
    }
  }

  // Hook into the site theme toggle button
  const toggleBtn = document.getElementById('theme-toggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      setTimeout(renderDiagrams, 50);
    });
  }

  // Listen for class changes on body and html
  const observer = new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (m.type === 'attributes' && m.attributeName === 'class') {
        setTimeout(renderDiagrams, 50);
        break;
      }
    }
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // Listen for system theme changes if user has not set a preference
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (!localStorage.getItem('pref-theme')) {
        renderDiagrams();
      }
    });
  }

  // Initial render
  renderDiagrams();
</script>
{{- end }}
