{{/*
    Custom head extensions: Fediverse verification, TLDR stylesheet, and optional KaTeX math rendering.
*/}}
<meta name="fediverse:creator" content="@sdjmchattie@hachyderm.io" />
<link rel="me" href="https://hachyderm.io/@sdjmchattie" />
<link rel="stylesheet" href="{{ .Site.Params.staticPath }}/css/tldr.css" media="all">

{{ if or (.Params.math | default false) (.Params.katex | default false) (.Site.Params.math | default false) }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  function renderMath() {
    if (typeof renderMathInElement === 'function') {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '\\[', right: '\\]', display: true},
          {left: '\\(', right: '\\)', display: false},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });
    } else {
      setTimeout(renderMath, 50);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderMath);
  } else {
    renderMath();
  }
</script>
{{ end }}
